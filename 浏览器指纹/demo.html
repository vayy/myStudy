<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>浏览器指纹</title>
    <script src="./fingerprintjs%205.0.1.js"></script>
</head>
<body>
<div id="container"></div>
</body>
</html>
<script>
    const elContainer = document.querySelector('#container');
    // 生成一个实例
    const fpPromise = FingerprintJS.load({
        // 由于这个库会有0.1%的概率会把他们需要的信息传到服务器上，以便于他们统计数据，把 monitoring 设置为 false 可以关闭这个功能
        monitoring: false,
        // 开启 debug 模式
        debug: true,
    });

    // 获取指纹
    fpPromise.then(fp => fp.get()).then(result => {
        /**
         * 指纹获取结果
         * interface GetResult {
         *   visitorId: string 指纹
         *   confidence: {
         *     score: number 指纹可信度
         *     comment?: string 附加信息
         *   }
         *   components: {  指纹生成的依据
         *     [key: string]:
         *       { value: any, duration: number } |
         *       { error: any, duration: number }
         *   }
         *   version: string 这个库的版本号
         * }
         */
        console.log(result);
        elContainer.innerText = `浏览器指纹：${ result.visitorId }`;

        // 将指纹生成的依据转换成哈希字符串，也就是 visitorId
        console.log(FingerprintJS.hashComponents(result.components));

        // 将指纹生成的依据转成对人类友好的格式
        console.log(FingerprintJS.componentsToDebugString(result.components));
    })
</script>
